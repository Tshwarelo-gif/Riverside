services:
  - type: web
    name: riverside-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:shared && npm run build:api
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: PORT
        value: 3001
